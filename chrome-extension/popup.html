<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WebPulse Selector</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 320px;
      min-height: 220px;
      background: #0B051D;
      color: #E9D5FF;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      padding: 20px;
    }

    .card {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: linear-gradient(135deg, #7C3AED 0%, #FFA052 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 18px;
      color: #0B051D;
      box-shadow: 0 0 16px rgba(255, 160, 82, 0.35);
      flex-shrink: 0;
    }

    .title-wrap h1 {
      font-size: 15px;
      font-weight: 700;
      color: #F3E8FF;
      line-height: 1.2;
    }

    .title-wrap p {
      font-size: 11px;
      color: #A78BFA;
      margin-top: 2px;
    }

    .instructions {
      font-size: 12px;
      line-height: 1.55;
      color: #C4B5FD;
      background: rgba(24, 14, 49, 0.7);
      border: 1px solid rgba(168, 85, 247, 0.25);
      border-radius: 10px;
      padding: 12px 14px;
    }

    #activateBtn {
      width: 100%;
      padding: 13px 16px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #FFA052 0%, #FB923C 100%);
      color: #0B051D;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
      box-shadow: 0 4px 20px rgba(255, 160, 82, 0.4);
    }

    #activateBtn:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 6px 24px rgba(255, 160, 82, 0.55);
    }

    #activateBtn:active:not(:disabled) {
      transform: translateY(0);
    }

    #activateBtn:disabled {
      cursor: default;
      opacity: 0.85;
    }

    #activateBtn.active {
      background: linear-gradient(135deg, #7C3AED 0%, #6D28D9 100%);
      color: #F3E8FF;
      box-shadow: 0 0 0 0 rgba(124, 58, 237, 0.5);
      animation: pulse 1.6s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% {
        box-shadow: 0 0 0 0 rgba(124, 58, 237, 0.45);
      }
      50% {
        box-shadow: 0 0 0 10px rgba(124, 58, 237, 0);
      }
    }

    .status {
      font-size: 11px;
      text-align: center;
      color: #A78BFA;
      min-height: 16px;
    }

    .status.error {
      color: #FCA5A5;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="logo" aria-hidden="true">W</div>
      <div class="title-wrap">
        <h1>WebPulse Selector</h1>
        <p>Visual CSS Inspector</p>
      </div>
    </div>

    <p class="instructions">
      Click <strong>Activate Inspector</strong>, hover over any element on the page, and click to copy its exact CSS selector to your clipboard.
    </p>

    <button id="activateBtn" type="button">Activate Inspector</button>
    <p id="status" class="status" role="status"></p>
  </div>

  <script src="popup.js"></script>
</body>
</html>
